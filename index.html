<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Casa de Sarah">
  <meta name="theme-color" content="#def5ec">
  <link rel="apple-touch-icon" href="img/icono-180.png">
  <link rel="icon" href="img/icono-180.png">
  <title>Casa de Sarah</title>
  <link rel="stylesheet" href="css/juego.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="juego">
    <!-- El lugar de la casa donde está el bebé -->
    <div id="escenario">
      <svg id="fondo" aria-hidden="true"></svg>
      <svg id="escena" aria-label="Bebé"></svg>
      <div id="herramientas"></div>

      <!-- De noche: se oscurece todo y salen estrellas -->
      <div id="oscuridad" aria-hidden="true">
        <span class="luna"></span>
        <span class="astro" style="left:12%;top:14%"></span>
        <span class="astro" style="left:30%;top:8%;animation-delay:.6s"></span>
        <span class="astro" style="left:52%;top:18%;animation-delay:1.1s"></span>
        <span class="astro" style="left:70%;top:9%;animation-delay:.3s"></span>
        <span class="astro" style="left:84%;top:22%;animation-delay:.9s"></span>
        <span class="astro" style="left:20%;top:32%;animation-delay:1.4s"></span>
      </div>

      <div id="contador" aria-label="Estrellas"><span>0</span></div>
      <button id="btn-sol" class="boton" aria-label="Despertar" hidden></button>
      <div id="chispas" aria-hidden="true"></div>
    </div>

    <!-- Lugares: casa, comer, bañar, dormir -->
    <nav id="barra"></nav>
  </div>

  <div id="manita" aria-hidden="true" hidden></div>

  <!-- Pantalla de inicio: el ▶ también desbloquea el audio en iOS -->
  <div id="inicio">
    <h1 id="titulo">Casa de Sarah</h1>
    <button id="btn-jugar" class="boton" aria-label="Jugar" hidden>
      <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M 36 22 L 78 50 L 36 78 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/></svg>
    </button>
  </div>
</body>
</html>
